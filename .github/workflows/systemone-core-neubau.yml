name: SystemONE Core (2026-08 Neuaufbau)

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'infrastructure/**'
      - 'scripts/check-import-boundaries.py'
      - 'scripts/check-secrets.py'
      - '.github/workflows/systemone-core-neubau.yml'
  push:
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'infrastructure/**'
      - 'scripts/check-import-boundaries.py'
      - 'scripts/check-secrets.py'
      - '.github/workflows/systemone-core-neubau.yml'

jobs:
  customer-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: systemone
          POSTGRES_PASSWORD: systemone
          POSTGRES_DB: systemone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://systemone:systemone@localhost:5432/systemone_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: pytest -q

  security-tests:
    # S1V2-02-015: its own dedicated security-test step, distinct from the
    # general `customer-backend` job above - runs only tests marked
    # `security` (authentication, authorization, privilege escalation,
    # household PIN, rate limits, CSRF, tampered IDs/data isolation, audit
    # tampering, secret leaks), so a security regression is visible as its
    # own failing check, not buried inside a large general test run.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: systemone
          POSTGRES_PASSWORD: systemone
          POSTGRES_DB: systemone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://systemone:systemone@localhost:5432/systemone_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: pytest -m security -q

  hq-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hq-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Installed directly (not a service container): the S1V2-02-004 MQTT
      # tests stop/restart the broker mid-test to prove reconnect/offline
      # behaviour, which needs process control a service container doesn't
      # give the job.
      - run: sudo apt-get update && sudo apt-get install -y mosquitto
      - run: pip install -e ".[dev]"
      - run: pytest -q

  home-assistant-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/home-assistant-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      # S1V2-02-016 DoD: "Mock- und echter HA-Integrationstest" - started
      # directly (not a `services:` container) because it needs a
      # bind-mounted configuration.yaml with the `demo:` platform enabled,
      # which a plain services: entry can't provide.
      - name: Start a real Home Assistant instance with demo entities
        run: |
          mkdir -p /tmp/ha-config
          cat > /tmp/ha-config/configuration.yaml <<'EOF'
          default_config:
          demo:
          EOF
          docker run -d --name ha-test -v /tmp/ha-config:/config -p 8123:8123 homeassistant/home-assistant:stable
      - name: Wait for Home Assistant to become reachable
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8123/ || true)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then echo "HA reachable"; exit 0; fi
            sleep 5
          done
          echo "Home Assistant did not become reachable in time"; docker logs ha-test; exit 1
      - run: HOME_ASSISTANT_URL=http://localhost:8123 pytest -q

  customer-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  docker-compose-config:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/docker-compose
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config

  import-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-import-boundaries.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-secrets.py
