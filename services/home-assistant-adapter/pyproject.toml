[project]
name = "systemone-home-assistant-adapter"
version = "0.1.0"
description = "SystemONE-facing interface boundary in front of Home Assistant. The only production integration path into Zigbee/Matter/Shelly/Hue (see ADR-0002)."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["home_assistant_adapter*"]
