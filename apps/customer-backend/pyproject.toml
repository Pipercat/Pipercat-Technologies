[project]
name = "systemone-customer-backend"
version = "0.1.0"
description = "SystemONE customer-system backend (FastAPI). Runs locally on Pi/Mini/Server/Rack, no runtime dependency on SystemONE HQ."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "aiomqtt>=2.0",
    "argon2-cffi>=23.1",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
