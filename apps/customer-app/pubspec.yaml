name: systemone_customer_app
description: >
  SystemONE customer companion app. Talks exclusively to a customer
  system's local apps/customer-backend via the SystemONE API v1 contract
  (packages/shared-contracts). See ADR-0002 for the target architecture.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
