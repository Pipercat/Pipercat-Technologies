[project]
name = "systemone-hq-backend"
version = "0.1.0"
description = "SystemONE HQ backend (FastAPI). Internal Pipercat platform: provisioning, customer/project management, updates, remote-access brokering, optional cloud backup."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
